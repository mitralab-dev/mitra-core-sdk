name: Release
run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.2.0-beta.0 or 0.2.0"
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate branch
        if: github.ref_name != 'main'
        run: |
          echo "::error::Releases are only allowed from the main branch."
          exit 1
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::Version must be X.Y.Z or X.Y.Z-beta.N using canonical numeric components."
            exit 1
          fi
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "::error::Requested version $VERSION does not match package.json version $PACKAGE_VERSION."
            exit 1
          fi

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check

  bump:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Set version
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
      - name: Commit and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"
          git push
          git push origin "v$VERSION"

  publish:
    needs: bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - name: Publish beta
        if: contains(inputs.version, '-beta.')
        run: npm publish --access public --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish stable
        if: ${{ !contains(inputs.version, '-beta.') }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
